name: Construire et publier

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule publication à la fois ; on laisse finir celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Les tests passent avant la construction : un barème faux ne doit pas
      # pouvoir arriver en ligne.
      - run: npm test

      - run: npm run build
        env:
          BASE_URL: ${{ vars.BASE_URL || '/site-kevin/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://favereaukevin-creator.github.io/site-kevin' }}
          # « publique » ouvre le site : identité de l'éditeur, contact, indexation.
          # Toute autre valeur, ou l'absence de variable, le garde en préversion.
          # Se règle dans Settings → Secrets and variables → Actions → Variables.
          DIFFUSION: ${{ vars.DIFFUSION || 'restreinte' }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
